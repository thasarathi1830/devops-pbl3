apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen
      color: blue
  template:
    metadata:
      labels:
        app: bluegreen
        color: blue
    spec:
      containers:
      - name: app
        image: thasarathi1830/bluegreen-app:v1
        ports:
        - containerPort: 3000
        env:
        - name: COLOR
          value: "blue"
        - name: VERSION
          value: "v1"
